services:
  postgres:
    image: postgres:16-alpine
    container_name: threat-exchange-db
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: threat
      POSTGRES_DB: threat_exchange
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U threat -d threat_exchange"
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
