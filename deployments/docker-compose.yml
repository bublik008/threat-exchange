services:
  postgres:
    image: postgres:16-alpine
    container_name: threat-exchange-db
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: threat
      POSTGRES_DB: threat_exchange
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat -d threat_exchange"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..             # Контекст сборки — корень проекта (где лежит Dockerfile)
      dockerfile: Dockerfile
    container_name: threat-exchange-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://threat:threat@postgres:5432/threat_exchange?sslmode=disable
      - HTTP_ADDR=:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: